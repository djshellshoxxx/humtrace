name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit/CLI tests
        run: make test
      - name: Synthetic validation
        run: python3 tools/validate_synthetic.py build/humtrace
      - name: Settings-matrix fuzz (30 s)
        run: make fuzz FUZZ_SECONDS=30
  sanitizers:
    runs-on: ubuntu-latest
    env:
      SAN: -std=c++20 -O1 -g -Wall -Wextra -Wpedantic -Wconversion -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4
      - name: AddressSanitizer and UndefinedBehaviorSanitizer tests
        run: make clean && make test CXXFLAGS="$SAN"
      - name: Settings-matrix fuzz under sanitizers (30 s)
        run: make fuzz CXXFLAGS="$SAN" FUZZ_SECONDS=30
  gui-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and packaging tools
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev cmake ninja-build
      - name: Configure and build
        run: cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build-cmake
      - name: Test (offscreen GUI tests and smoke fuzzers included)
        run: cd build-cmake && ctest --output-on-failure
      - name: GUI settings-matrix fuzz (30 s)
        run: QT_QPA_PLATFORM=offscreen build-cmake/bin/gui_settings_fuzz 30
      - name: Package
        run: |
          cd build-cmake
          cpack -G DEB && cpack -G TGZ
          sha256sum humtrace-*.deb humtrace-*.tar.gz | tee SHA256SUMS
      - name: Smoke test the installed package
        run: |
          sudo apt-get install -y ./build-cmake/humtrace-*.deb
          python3 - <<'PY'
          import math, struct, wave
          with wave.open("smoke.wav", "wb") as o:
              o.setnchannels(1); o.setsampwidth(2); o.setframerate(4096)
              o.writeframes(b"".join(struct.pack("<h", round(9000*math.sin(2*math.pi*60*i/4096))) for i in range(16384)))
          PY
          humtrace smoke.wav --json smoke.json
          python3 -c "import json; d=json.load(open('smoke.json')); assert d['channels'][0]['tracks'], d"
          QT_QPA_PLATFORM=offscreen timeout 5 humtrace-gui smoke.wav || test $? -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build-cmake/humtrace-*.deb
            build-cmake/humtrace-*.tar.gz
            build-cmake/SHA256SUMS
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python make
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-qt6-base zip
      - name: Core build and tests
        run: make test
      - name: Qt build, tests, and package
        run: |
          cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake
          cd build-cmake && QT_QPA_PLATFORM=offscreen ctest --output-on-failure
          cd bin && windeployqt6 humtrace-gui.exe && cp ../../docs/release/THIRD_PARTY_NOTICES.md . && zip -r ../humtrace-0.1.0-windows.zip humtrace.exe humtrace-gui.exe '*.dll' platforms styles imageformats THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: build-cmake/humtrace-*.zip

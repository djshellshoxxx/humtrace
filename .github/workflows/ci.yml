name: CI

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: humtrace-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install schema validator and numpy tools
        run: pip install jsonschema
      - name: Build and unit/CLI tests (schema validation is mandatory here)
        run: make test
        env:
          HUMTRACE_REQUIRE_JSONSCHEMA: "1"
      - name: Packaging regression tests
        run: python3 tests/test_packaging.py && python3 tests/test_package_licenses.py && python3 tests/test_qt_sources.py && python3 tests/test_macos_packaging.py
      - name: Synthetic validation
        run: python3 tools/validate_synthetic.py build/humtrace
      - name: CLI QA matrix (formats, corruption, immutability, memory, cancel)
        run: python3 tools/qa_run.py build/humtrace
      - name: Disk-backed long-file memory acceptance
        run: python3 tools/validate_streaming_memory.py build/humtrace
      - name: Settings-matrix fuzz (30 s)
        run: make fuzz FUZZ_SECONDS=30
  sanitizers:
    runs-on: ubuntu-latest
    env:
      SAN: -std=c++20 -O1 -g -Wall -Wextra -Wpedantic -Wconversion -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4
      - name: AddressSanitizer and UndefinedBehaviorSanitizer tests
        run: make clean && make test CXXFLAGS="$SAN"
      - name: Settings-matrix fuzz under sanitizers (30 s)
        run: make fuzz CXXFLAGS="$SAN" FUZZ_SECONDS=30
  gui-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and packaging tools
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev cmake ninja-build
      - name: Configure and build
        run: cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build-cmake
      - name: Test (offscreen GUI tests and smoke fuzzers included)
        run: pip install jsonschema && cd build-cmake && HUMTRACE_REQUIRE_JSONSCHEMA=1 ctest --output-on-failure
      - name: Paged GUI long-file memory and heartbeat acceptance
        run: python3 tools/validate_paged_gui_memory.py build-cmake/bin/app_test_paged_memory
      - name: GUI settings-matrix fuzz (30 s)
        run: QT_QPA_PLATFORM=offscreen build-cmake/bin/gui_settings_fuzz 30
      - name: Package
        run: |
          cd build-cmake
          cpack -G DEB && cpack -G TGZ
          sha256sum humtrace-*.deb humtrace-*.tar.gz | tee SHA256SUMS
      - name: Smoke test the installed package
        run: |
          sudo apt-get install -y ./build-cmake/humtrace-*.deb
          python3 - <<'PY'
          import math, struct, wave
          with wave.open("smoke.wav", "wb") as o:
              o.setnchannels(1); o.setsampwidth(2); o.setframerate(4096)
              o.writeframes(b"".join(struct.pack("<h", round(9000*math.sin(2*math.pi*60*i/4096))) for i in range(16384)))
          PY
          humtrace smoke.wav --json smoke.json
          python3 -c "import json; d=json.load(open('smoke.json')); assert d['channels'][0]['tracks'], d"
          QT_QPA_PLATFORM=offscreen timeout 5 humtrace-gui smoke.wav || test $? -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build-cmake/humtrace-*.deb
            build-cmake/humtrace-*.tar.gz
            build-cmake/SHA256SUMS
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python make
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-qt6-base zip unzip
      - name: Core build and tests
        run: make test
      - name: Qt build, tests, and package
        run: |
          cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake
          cd build-cmake && QT_QPA_PLATFORM=offscreen ctest --output-on-failure
          VER=$(sed -n 's/^project(HumTrace VERSION \([0-9.]*\).*/\1/p' ../CMakeLists.txt)
          cd ..
          mkdir build-cmake/package
          cp build-cmake/bin/humtrace.exe build-cmake/bin/humtrace-gui.exe build-cmake/package/
          windeployqt6 --compiler-runtime --no-patchqt --dir build-cmake/package build-cmake/package/humtrace-gui.exe
          printf '[Paths]\nPrefix=.\nPlugins=.\n' > build-cmake/package/qt.conf
          cp docs/release/THIRD_PARTY_NOTICES.md docs/user-guide/limitations.md build-cmake/SOURCE_COMMIT.txt build-cmake/package/
          python3 tools/package_windows.py --stage build-cmake/package --runtime /ucrt64/bin
          python3 tools/package_licenses.py --stage build-cmake/package --runtime /ucrt64/bin
          mkdir build-cmake/package/qtbase-source
          python3 tools/package_qt_sources.py --stage build-cmake/package/qtbase-source --version "$(qmake6 -query QT_VERSION)"
          pacman -Q > build-cmake/package/MSYS2_PACKAGES.txt
          python3 tools/package_windows.py --stage build-cmake/package --runtime /ucrt64/bin --archive build-cmake/humtrace-$VER-windows.zip
      - name: Windows smoke test (extracted package runs on a generated WAV)
        run: |
          cd build-cmake
          VER=$(sed -n 's/^project(HumTrace VERSION \([0-9.]*\).*/\1/p' ../CMakeLists.txt)
          python3 -c "
          import math, struct, wave
          with wave.open('smoke.wav','wb') as o:
              o.setnchannels(1); o.setsampwidth(2); o.setframerate(4096)
              o.writeframes(b''.join(struct.pack('<h', round(9000*math.sin(2*math.pi*60*i/4096))) for i in range(16384)))
          "
          mkdir -p pkgtest && cd pkgtest && unzip -o -q ../humtrace-$VER-windows.zip
          python3 ../../tools/smoke_package.py --cli humtrace.exe --gui humtrace-gui.exe
          cd .. && sha256sum humtrace-$VER-windows.zip | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            build-cmake/humtrace-*.zip
            build-cmake/SHA256SUMS
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and build tools
        run: brew install qtbase cmake ninja
      - name: Core build and tests
        run: make test
      - name: Qt build and tests
        run: |
          cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qtbase)" -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build build-cmake
          cd build-cmake && QT_QPA_PLATFORM=offscreen ctest --output-on-failure
      - name: Package (ad-hoc signed app bundle + CLI)
        run: |
          VER=$(sed -n 's/^project(HumTrace VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          cd build-cmake/bin
          lipo -verify_arch ${{ matrix.arch }} humtrace
          lipo -verify_arch ${{ matrix.arch }} humtrace-gui.app/Contents/MacOS/humtrace-gui
          python3 ../../tools/package_macos.py --app humtrace-gui.app --qt-prefix "$(brew --prefix qtbase)" --brew-prefix "$(brew --prefix)"
          cp ../../docs/release/THIRD_PARTY_NOTICES.md ../../docs/user-guide/limitations.md ../SOURCE_COMMIT.txt .
          mkdir qtbase-source
          python3 ../../tools/package_qt_sources.py --stage qtbase-source --version "$("$(brew --prefix qtbase)/bin/qmake" -query QT_VERSION)"
          brew info --json=v2 qtbase > qtbase-source/BREW_INFO.json
          codesign --verify --deep --strict humtrace-gui.app
          zip -qry "../humtrace-$VER-macos-${{ matrix.arch }}.zip" humtrace-gui.app humtrace THIRD_PARTY_NOTICES.md limitations.md SOURCE_COMMIT.txt qtbase-source
          cd .. && shasum -a 256 humtrace-*.zip | tee SHA256SUMS
      - name: Smoke test extracted CLI and GUI
        run: |
          VER=$(sed -n 's/^project(HumTrace VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          python3 - <<'PY'
          import math, struct, wave
          with wave.open("smoke.wav", "wb") as o:
              o.setnchannels(1); o.setsampwidth(2); o.setframerate(4096)
              o.writeframes(b"".join(struct.pack("<h", round(9000*math.sin(2*math.pi*60*i/4096))) for i in range(16384)))
          PY
          mkdir pkgtest && cd pkgtest && unzip -q ../build-cmake/humtrace-$VER-macos-${{ matrix.arch }}.zip
          python3 ../tools/smoke_package.py --cli humtrace --gui humtrace-gui.app/Contents/MacOS/humtrace-gui
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-zip
          path: |
            build-cmake/humtrace-*.zip
            build-cmake/SHA256SUMS
  release:
    needs: [core-linux, sanitizers, gui-linux, windows, macos]
    # Publishes a pre-release from tags, main, manual runs, and (until merged) the delivery branch.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/project-completion-builds-sokivz' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(sed -n 's/^project(HumTrace VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Validate release identity
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag/project version mismatch"; exit 1; }
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Record tested source
        run: |
          printf '%s\n' '${{ github.sha }}' > dist/SOURCE_COMMIT.txt
          git archive --format=tar.gz --prefix=humtrace-source/ HEAD > dist/humtrace-${{ steps.v.outputs.version }}-source.tar.gz
      - name: Combine checksums
        run: |
          cd dist && ls -l
          sha256sum humtrace-* SOURCE_COMMIT.txt > SHA256SUMS.txt && rm -f SHA256SUMS && cat SHA256SUMS.txt
      - name: Compose traceable release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          NATIVE_CI_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          notes = Path(f"docs/release/release-notes-{os.environ['VERSION']}.md").read_text(encoding="utf-8")
          notes += f"\n\nSource commit: [{os.environ['SOURCE_SHA']}]({os.environ['SOURCE_URL']}).\n"
          notes += f"Native build, tests and package smoke evidence: [CI run]({os.environ['NATIVE_CI_URL']}).\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY
      - name: Refuse to replace a published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/releases/tags/v$VERSION" --silent --include 2>&1) && { echo "Release v$VERSION already exists; refusing replacement"; exit 1; }
          printf '%s' "$status" | grep -q '404' || { printf '%s\n' "$status"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HumTrace ${{ steps.v.outputs.version }} (preview)
          prerelease: true
          overwrite_files: false
          fail_on_unmatched_files: true
          make_latest: false
          body_path: release-notes.md
          files: dist/*

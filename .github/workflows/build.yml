name: Build artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fixed timestamp so archives are byte-reproducible for identical inputs.
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, shell: bash, ldflags: "-static-libstdc++ -static-libgcc", exe: humtrace }
          - { name: macos-arm64, os: macos-14, shell: bash, ldflags: "", exe: humtrace }
          - { name: windows-x86_64, os: windows-2022, shell: "msys2 {0}", ldflags: "-static", exe: humtrace.exe }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python make zip
      - name: Build and test
        run: |
          make clean
          make test LDFLAGS="${{ matrix.ldflags }}" CXXFLAGS="-std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Werror -ffile-prefix-map=$PWD=."
      - name: Package
        run: |
          set -eu
          name="humtrace-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp "build/${{ matrix.exe }}" README.md "dist/$name/"
          cp -r schema "dist/$name/schema"
          git rev-parse HEAD > "dist/$name/SOURCE_COMMIT"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            find "$name" -exec touch -d "@$SOURCE_DATE_EPOCH" {} +
            find "$name" | LC_ALL=C sort | zip -X -@ "$name.zip" >/dev/null
            archive="$name.zip"
          else
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" -cf - "$name" | gzip -n > "$name.tar.gz"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          cat "$archive.sha256"
      - name: Smoke-test packaged artifact
        run: |
          set -eu
          cd dist
          name="humtrace-${{ matrix.name }}"
          mkdir -p ../verify && cd ../verify
          if [ "${{ runner.os }}" = "Windows" ]; then unzip -q "../dist/$name.zip"; else tar -xzf "../dist/$name.tar.gz"; fi
          python3 ../tests/smoke_artifact.py "./$name/${{ matrix.exe }}" || python ../tests/smoke_artifact.py "./$name/${{ matrix.exe }}"
      - uses: actions/upload-artifact@v4
        with:
          name: humtrace-${{ matrix.name }}
          path: dist/humtrace-${{ matrix.name }}.*
          if-no-files-found: error
